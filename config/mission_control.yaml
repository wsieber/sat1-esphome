# Satellite1 928f08 (satellite1-928f08, 192.168.41.179): for `esphome logs config/mission_control.yaml`.
# Flash with satellite1.yaml as usual; this only adds the API key Home Assistant gave this device,
# which the command line needs to connect. The key lives in the gitignored secrets.yaml.
packages:
  satellite1: !include satellite1.yaml

api:
  encryption:
    key: !secret mission_control_api_key

wifi:
  use_address: 192.168.41.179

# Trial (2026-10-23): a longer window for Yo Frederick on this unit only, after three false wakes
# from a YouTube video scored right at the 0.95 cutoff. Merged into satellite1.yaml by id.
micro_wake_word:
  models:
    - id: !extend yo_frederick
      sliding_window_size: 8
